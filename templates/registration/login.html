{% extends "base.html" %}
{% block title %}登入 · 防火板計價系統{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin:40px auto;">
  <h1>登入</h1>
  {% if form.errors %}<p class="errorlist">用戶名稱或密碼不正確，請再試。</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>用戶名稱<br>{{ form.username }}</label></p>
    <p><label>密碼<br>{{ form.password }}</label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">登入</button>
  </form>
</div>
{% endblock %}
