{% extends "base.html" %}
{% load fb %}
{% block title %}{% t "登入 · 防火板計價系統" %}{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin:40px auto;">
  <h1>{% t "登入" %}</h1>
  {% if form.errors %}<p class="errorlist">{% t "用戶名稱或密碼不正確，請再試。" %}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>{% t "用戶名稱" %}<br>{{ form.username }}</label></p>
    <p><label>{% t "密碼" %}<br>{{ form.password }}</label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">{% t "登入" %}</button>
  </form>
</div>
{% endblock %}
